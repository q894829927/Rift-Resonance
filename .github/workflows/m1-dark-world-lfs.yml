name: Import Dark World PNGs to Git LFS
on:
  push:
    branches: [codex/m1-art-cc0-bootstrap]
    paths:
      - .github/asset-bootstrap/dark-world-04.b64.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm Git LFS installed
        run: |
          git lfs version
          git lfs install --local
      - name: Restore original PNG byte streams and check every SHA256
        run: python3 tools/art/restore_dark_world_lfs.py
      - name: Track original Dark World files through Git LFS
        run: |
          git lfs track "apps/client/public/assets/vendor/kaishido/dark-world-v1/**/*.png"
          git check-attr filter -- apps/client/public/assets/vendor/kaishido/dark-world-v1/Environment/tree.png | grep -q "filter: lfs"
          git add .gitattributes apps/client/public/assets/vendor/kaishido/dark-world-v1
          git lfs ls-files --cached | tee /tmp/lfs-files.txt
          test "$(wc -l < /tmp/lfs-files.txt)" -eq 20
      - name: Commit and upload LFS objects (not Git blobs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/asset-bootstrap/dark-world-0{1,2,3,4}.b64.txt
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/art/ASSET-SOURCES.md')
          text = path.read_text()
          original = '| Kaishido Dark World | https://kaishido.itch.io/dark-world | 0 (user ZIP received; 20 PNG, import pending) | CC0 (author page) |'
          revised = '| Kaishido Dark World | https://kaishido.itch.io/dark-world | 20 PNG (Git LFS; original bytes) | CC0 (author page) |'
          if original not in text:
              raise ValueError('Unexpected asset sources status')
          path.write_text(text.replace(original, revised))
          PY
          git add docs/art/ASSET-SOURCES.md
          git commit -m "assets(m1): vendor 20 original Dark World PNGs through Git LFS"
          git push origin HEAD:refs/heads/codex/m1-art-cc0-bootstrap
