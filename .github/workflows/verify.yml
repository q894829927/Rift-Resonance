name: M0-A Verify
on:
  push:
    branches: [main, codex/m0-a-scaffold]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 发生受控的直接依赖变更时刷新 lock；之后 npm ci 进行严格复现。
      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Verify types, build and core tests
        run: npm run verify
      - name: Smoke test server and static client
        run: |
          set -euo pipefail
          npm run start -w @rift/server > /tmp/rift-server.log 2>&1 &
          SERVER_PID=$!
          npm run preview -w @rift/client -- --port 4173 > /tmp/rift-client.log 2>&1 &
          CLIENT_PID=$!
          trap 'kill "$SERVER_PID" "$CLIENT_PID" 2>/dev/null || true; cat /tmp/rift-server.log; cat /tmp/rift-client.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2567/health -o /tmp/rift-health.json &&
               curl --fail --silent http://127.0.0.1:4173/ -o /tmp/rift-index.html; then
              break
            fi
            sleep 1
          done
          node -e 'const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/rift-health.json","utf8"));if(d.status!=="ok"||d.protocolVersion!==1) process.exit(1)'
          grep -q '异界共振' /tmp/rift-index.html
      - name: Production dependency audit (high severity gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Persist initial lock on feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/m0-a-scaffold'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(m0-a): lock npm dependency tree"
            git push origin HEAD:codex/m0-a-scaffold
          fi
      - name: Archive dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-a-package-lock
          path: package-lock.json
          if-no-files-found: ignore
