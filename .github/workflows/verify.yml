name: Rift Resonance Verify
on:
  push:
    branches: [main, codex/m0-f-stability-telemetry]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and unit tests
        run: npm run verify
      - name: HTTP and two-client integration
        run: |
          set -euo pipefail
          M0_DIAGNOSTICS=1 npm run start -w @rift/server > /tmp/rift-server.log 2>&1 &
          SERVER_PID=$!
          npm run preview -w @rift/client -- --port 4173 > /tmp/rift-client.log 2>&1 &
          CLIENT_PID=$!
          trap 'kill "$SERVER_PID" "$CLIENT_PID" 2>/dev/null || true; cat /tmp/rift-server.log; cat /tmp/rift-client.log' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:2567/health -o /tmp/rift-health.json &&
               curl -fsS http://127.0.0.1:4173/ -o /tmp/rift-index.html; then break; fi
            sleep 1
          done
          node -e 'const d=require("/tmp/rift-health.json");if(d.status!=="ok"||d.protocolVersion!==1)process.exit(1)'
          grep -q '异界共振' /tmp/rift-index.html
          npm run test:integration
          node tools/qa/m0-f.mjs --players=4 --duration-sec=12 --require-metrics --report=reports/m0-f-baseline.json
          node tools/qa/m0-f.mjs --players=4 --duration-sec=12 --rtt-ms=80 --jitter-ms=10 --require-metrics --report=reports/m0-f-rtt80.json
          node tools/qa/m0-f.mjs --players=4 --duration-sec=12 --rtt-ms=150 --jitter-ms=20 --disconnect --require-metrics --report=reports/m0-f-rtt150-disconnect.json
      - name: Production dependency audit (high severity gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Archive M0-F raw benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-f-benchmarks
          path: reports/m0-f-*.json
          if-no-files-found: warn
