name: V2 Dual Weapon CI
on:
  push:
    branches: [codex/v2-dual-weapon-foundation]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Unit tests (legacy and V2)
        run: npm test
      - name: Start integration server
        run: |
          npm run start -w @rift/server > /tmp/rift-v2-server.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:2567/health > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/rift-v2-server.log
          exit 1
      - name: Two-client integration regression
        run: npm run test:integration
      - name: Start V2 authoritative room
        run: |
          PORT=2570 RIFT_V2_DUAL_WEAPONS=1 npm run start -w @rift/server > /tmp/rift-v2-newroom.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:2570/health > /dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/rift-v2-newroom.log
          exit 1
      - name: Verify V2 networked gravity core
        run: TEST_SERVER_URL=http://127.0.0.1:2570 node --test tests/v2-network/*.test.mjs
      - name: Print server log on failure
        if: failure()
        run: |
          cat /tmp/rift-v2-server.log || true
          cat /tmp/rift-v2-newroom.log || true
